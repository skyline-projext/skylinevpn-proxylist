name: Release

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday 00:00 UTC
  push:
    branches: [main]
    paths: [proxy.list]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge upstream into proxy.list
        run: ./scripts/build.sh proxy.list

      - name: Commit if changed
        run: |
          git config user.name "skyline-projext"
          git config user.email "176280006+skyline-projext@users.noreply.github.com"
          git add proxy.list
          git diff --cached --quiet || git commit -m "Update proxy.list $(date -u +%Y-%m-%d)"
          git push

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%Y%m%d)"
          RULES=$(grep -vcE "^(#|$)" proxy.list)
          # Re-running on the same day replaces that day's release
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" proxy.list \
            --title "proxy.list $TAG" \
            --notes "Rules: ${RULES}. License: Skyline Networking Tech LLC." \
            --target "$(git rev-parse HEAD)" \
            --latest
          # Move the latest tag to this release commit for a fixed URL
          # raw.githubusercontent.com/<repo>/latest/proxy.list
          git tag -f latest HEAD
          git push -f origin refs/tags/latest
